name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('daemon/Cargo.lock') }}
      - name: Run tests
        working-directory: daemon
        run: cargo test --workspace

  rust-build:
    name: Build Daemon (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: lattice
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: lattice.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: lattice
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: lattice
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release
        working-directory: daemon
        run: cargo build --release --target ${{ matrix.target }}
      - name: Generate SHA-256
        shell: bash
        run: |
          cd daemon/target/${{ matrix.target }}/release
          sha256sum ${{ matrix.binary }} > ${{ matrix.binary }}.sha256 || shasum -a 256 ${{ matrix.binary }} > ${{ matrix.binary }}.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lattice-${{ matrix.target }}
          path: |
            daemon/target/${{ matrix.target }}/release/${{ matrix.binary }}
            daemon/target/${{ matrix.target }}/release/${{ matrix.binary }}.sha256

  extension-build:
    name: Extension Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: extension
        run: npm ci
      - name: Compile
        working-directory: extension
        run: npm run compile
      - name: Lint
        working-directory: extension
        run: npm run lint || true
