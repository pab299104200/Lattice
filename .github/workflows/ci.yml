name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: ${{ runner.os }}-cargo-stable-${{ matrix.target }}-debug-default-${{ hashFiles('daemon/Cargo.lock') }}
      - name: Run tests
        working-directory: daemon
        run: cargo test --workspace --target ${{ matrix.target }}

  rust-build:
    name: Build Daemon (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: lattice
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: lattice.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: lattice
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: lattice
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: ${{ runner.os }}-cargo-stable-${{ matrix.target }}-release-default-${{ hashFiles('daemon/Cargo.lock') }}
      - name: Build release
        working-directory: daemon
        run: cargo build --release --target ${{ matrix.target }}
      - name: Generate SHA-256
        shell: bash
        run: |
          cd daemon/target/${{ matrix.target }}/release
          sha256sum ${{ matrix.binary }} > ${{ matrix.binary }}.sha256 || shasum -a 256 ${{ matrix.binary }} > ${{ matrix.binary }}.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lattice-${{ matrix.target }}
          path: |
            daemon/target/${{ matrix.target }}/release/${{ matrix.binary }}
            daemon/target/${{ matrix.target }}/release/${{ matrix.binary }}.sha256
          retention-days: 14

  shell-harness-tests:
    name: Shell Harness Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Codex and Claude hook packages
        run: bash integrations/codex/tests/hooks_test.sh
      - name: Test Codex installer idempotency
        run: bash integrations/codex/tests/install_test.sh
      - name: Test worth-it benchmark contract
        run: bash tools/tests/worth-it-benchmark_test.sh
      - name: Test storage benchmark measurement contract
        run: python3 -W error::ResourceWarning tools/tests/storage-benchmark_test.py
      - name: Test writable agent efficacy harness contract
        run: |
          python3 -W error::ResourceWarning tools/tests/efficacy-fixtures_test.py
          python3 -W error::ResourceWarning tools/tests/agent-efficacy_test.py
          python3 -W error::ResourceWarning tools/tests/efficacy-supersession_test.py
