[workspace]
resolver = "2"
members = [
    "crates/lattice-core",
    "crates/lattice-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
lattice-core = { path = "crates/lattice-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ciborium = "0.2.2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
petgraph = "0.6"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
async-trait = "0.1"
notify = "7"
libc = "0.2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
ort = { version = "2.0.0-rc.11", features = ["load-dynamic"] }
ndarray = "0.16"
tokenizers = "0.20"
ignore = "0.4"
usearch = { version = "2.24", default-features = false }

# Full debug information and per-session incremental state made local test
# artifacts consume tens of GiB. Keep useful backtraces without that footprint.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
